app = 'fly-tk-cba'
primary_region = 'fra'

[build]
  dockerfile = 'Dockerfile'
  build_args = { CACHE_BUSTER = "v-final-2" }

[[mounts]]
  source = 'anvil_data'
  destination = '/data-v3'

[http_service]
  internal_port = 8545
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

[[restart]]
  policy = "always"

[[vm]]
  cpu_kind = 'shared'
  cpus = 2
  memory_mb = 1024
