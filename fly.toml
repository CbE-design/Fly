# fly.toml app configuration file generated for fly-tk-cba on 2026-11-12T13:10:13Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'fly-tk-cba'
primary_region = 'ams'

[build]
  dockerfile = 'Dockerfile'

[[mounts]]
  source = 'anvil_data'
  destination = '/data'

[http_service]
  internal_port = 8545
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

[[restart]]
  policy = 'always'

[[vm]]
  cpu_kind = 'shared'
  cpus = 2
  memory_mb = 1024
